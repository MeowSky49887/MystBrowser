<!DOCTYPE html>
<html lang="th">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calendar</title>

        <style>
            body {
                margin: 20px;
                display: flex;
                justify-content: center;
                align-items: center;
                background: rgba(0, 0, 0, 0);
                font-family: Arial, sans-serif;
                color: white;
            }

            .calendar {
                width: 440px;
                padding: 20px;
                border-radius: 20px;
                background: rgba(255, 255, 255, 0.6);
                box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);            
            }

            .header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 20px;
            }

            .header button {
                background:rgb(40, 100, 235, 0.6);
                border: none;
                color: white;
                padding: 8px 16px;
                border-radius: 10px;
                cursor: pointer;
                font-size: 16px;
            }

            .header h2 {
                margin: 0;
                font-size: 22px;
            }

            .days {
                margin-bottom: 8px;
            }

            .days,
            .dates {
                display: grid;
                grid-template-columns: repeat(7,1fr);
                gap: 6px;
            }

            .days div {
                text-align: center;
                font-weight: bold;
                color: rgb(150, 200, 255);
            }

            .date {
                background: rgba(128, 128, 128, 0.6);
                border-radius: 12px;
                min-height: 40px;
                padding: 10px;
                font-size: 14px;
                display: flex;
                align-items: flex-start;
                justify-content: flex-start;
            }

            .today {
                background: rgba(64, 64, 64, 0.8);
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <div class="calendar">
            <div class="header">
                <button onclick="prevMonth()">◀</button>
                <h2 id="monthYear"></h2>
                <button onclick="nextMonth()">▶</button>
            </div>

            <div class="days">
                <div>จ</div>
                <div>อ</div>
                <div>พ</div>
                <div>พฤ</div>
                <div>ศ</div>
                <div>ส</div>
                <div>อา</div>
            </div>

            <div class="dates" id="dates"></div>
        </div>

        <script>
            const datesEl = document.getElementById("dates");
            const monthYear = document.getElementById("monthYear");

            let currentDate = new Date();

            function renderCalendar() {

                datesEl.innerHTML = "";

                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();

                let firstDay =
                    new Date(year, month, 1).getDay();

                // เปลี่ยนให้เริ่มสัปดาห์วันจันทร์
                firstDay = (firstDay === 0) ? 6 : firstDay - 1;

                const lastDate =
                    new Date(year, month + 1, 0).getDate();

                const thaiMonths = [
                    "มกราคม",
                    "กุมภาพันธ์",
                    "มีนาคม",
                    "เมษายน",
                    "พฤษภาคม",
                    "มิถุนายน",
                    "กรกฎาคม",
                    "สิงหาคม",
                    "กันยายน",
                    "ตุลาคม",
                    "พฤศจิกายน",
                    "ธันวาคม"
                ];

                monthYear.textContent =
                    `${thaiMonths[month]} ${year + 543}`;

                // ช่องว่างก่อนวันแรก
                for(let i = 0; i < firstDay; i++){
                    datesEl.innerHTML += "<div></div>";
                }

                // สร้างวัน
                for(let day = 1; day <= lastDate; day++) {

                    const today = new Date();

                    const isToday =
                    day === today.getDate() &&
                    month === today.getMonth() &&
                    year === today.getFullYear();

                    let className = "date";

                    if(isToday)
                    className += " today";

                    datesEl.innerHTML += `
                    <div class="${className}">
                        ${day}
                    </div>
                    `;
                }
            }

            function prevMonth() {
                currentDate.setMonth(
                    currentDate.getMonth() - 1
                );

                renderCalendar();
            }

            function nextMonth() {
                currentDate.setMonth(
                    currentDate.getMonth() + 1
                );

                renderCalendar();
            }

            renderCalendar();
        </script>

    </body>
</html>
