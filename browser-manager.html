<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>MystBrowser</title>

        <link href="./libs/tailwind.custom.css" rel="stylesheet" type="text/css" />

        <link href="./libs/overlayscrollbars.css" rel="stylesheet" type="text/css" />
        <script src="./libs/overlayscrollbars.browser.es6.min.js" defer></script>

        <style>
            @layer properties, theme, base, components, utilities, override;

            @media (prefers-color-scheme: light) {
                
            }

            @media (prefers-color-scheme: dark) {
                
            }

            @font-face {
                font-family: 'Material Symbols Outlined';
                font-style: normal;
                src: url('./libs/MaterialSymbolsOutlined.ttf') format('truetype');
            }

            .tab::before {
                --radius-start: radial-gradient(circle at top left, var(--tab-radius-grad)) !important; --radius-end: radial-gradient(circle at top right, var(--tab-radius-grad)) !important;
            }

            .tab {
                transition: transform 160ms cubic-bezier(.2,.8,.2,1);
                will-change: transform;
            }

            .tab.dragging {
                position: absolute;
                top: 0;
                pointer-events: none;
                z-index: 1000;
            }

            .material-symbols-outlined {
                font-family: 'Material Symbols Outlined';
                font-weight: normal;
                font-style: normal;
                font-size: 24px;
                display: inline-block;
                line-height: 1;
                text-transform: none;
                letter-spacing: normal;
                word-wrap: normal;
                white-space: nowrap;
                direction: ltr;
            }
        </style>
    </head>
    <body class="bg-base-300 text-base-content flex flex-col items-center justify-center p-0 m-0 overflow-hidden">

        <!-- Tab Container -->
        <div class="w-full! h-[40px]! overflow-x-auto bg-base-300 flex items-center" data-overlayscrollbars-x>
            <div role="tablist" id="tabs" class="tabs tabs-lift flex-nowrap! px-2 relative">
            </div>
        </div>

        <!-- Navigation Bar -->
        <div class="w-full! h-[40px]! flex items-center px-4 space-x-2 bg-base-200 shadow-md">
            <button class="btn btn-sm btn-ghost" onclick="navBack()"><span class="material-symbols-outlined">arrow_back</span></button>
            <button class="btn btn-sm btn-ghost" onclick="navForward()"><span class="material-symbols-outlined">arrow_forward</span></button>
            <button class="btn btn-sm btn-ghost" onclick="refreshPage()"><span class="material-symbols-outlined">refresh</span></button>
            <input id="urlInput" type="text" class="input input-sm input-bordered flex-1 bg-base-200 border-base-100 focus:ring-2 focus:ring-neutral-500 h-[32px]!" placeholder="Enter website URL" onkeypress="handleUrlKeyPress(event)">
            <button class="btn btn-sm btn-ghost" onclick="navigateToUrl()"><span class="material-symbols-outlined">search</span></button>
            <button class="btn btn-sm btn-ghost" onclick="addTab()"><span class="material-symbols-outlined">add</span></button>
            <button class="btn btn-sm btn-ghost" onclick="popTab()"><span class="material-symbols-outlined">flip_to_front</span></button>
            <button class="btn btn-sm btn-ghost" onclick="window.electronAPI.manageWidgets(true)"><span class="material-symbols-outlined">menu</span></button>
        </div>

        <!-- Control Panel -->
        <div id="manager" class="w-screen h-[calc(100vh-80px)] px-12 py-8 overflow-y-auto relative bg-base-300" data-overlayscrollbars-y>
            <h2 class="text-xl font-bold text-center mb-4">MystBrowser</h2>

            <!-- Window Layer Management -->
            <h3 class="text-lg font-semibold mb-4">Window Layer Management</h3>
            <div class="grid grid-cols-2 gap-4">
                <div class="tooltip tooltip-top" data-tip="Moves window above the wallpaper layer">
                    <button class="btn bg-neutral hover:bg-neutral/50 w-full text-xs" onclick="sendAction('attachAsWallpaper')">Wallpaper Layer</button>
                </div>
                <div class="tooltip tooltip-top" data-tip="Moves window above desktop icons">
                    <button class="btn bg-neutral hover:bg-neutral/50 w-full text-xs" onclick="sendAction('attachAsDesktop')">Desktop Layer</button>
                </div>
                <div class="tooltip tooltip-top" data-tip="Keeps window always on top">
                    <button class="btn bg-neutral hover:bg-neutral/50 w-full text-xs" onclick="sendAction('attachToTop')">Always On Top</button>
                </div>
                <div class="tooltip tooltip-top" data-tip="Restores normal window behavior">
                    <button class="btn bg-neutral hover:bg-neutral/50 w-full text-xs" onclick="sendAction('detachWindow')">Detach Window</button>
                </div>
            </div>

            <br><hr><br>

            <!-- Window Ordering -->
            <h3 class="text-lg font-semibold mb-4">Window Ordering</h3>
            <div class="grid grid-cols-2 gap-4">
                <div class="tooltip tooltip-top" data-tip="Moves the window behind all others">
                    <button class="btn bg-neutral hover:bg-neutral/50 w-full text-xs" onclick="sendAction('sendToBack')">Send to Back</button>
                </div>
                <div class="tooltip tooltip-top" data-tip="Brings the window above all others">
                    <button class="btn bg-neutral hover:bg-neutral/50 w-full text-xs" onclick="sendAction('bringToFront')">Bring to Front</button>
                </div>
            </div>

            <br><hr><br>

            <!-- Window Placement and Sizing -->
            <h3 class="text-lg font-semibold mb-4">Window Placement & Sizing</h3>
            <div class="grid grid-rows-4 gap-4">
                <div class="flex gap-2">
                    <input id="moveX" type="number" placeholder="X" class="input input-bordered w-1/2 text-xs" value="100">
                    <input id="moveY" type="number" placeholder="Y" class="input input-bordered w-1/2 text-xs" value="100">
                </div>
                <div class="tooltip tooltip-top w-full" data-tip="Moves the window to a specified position">
                    <button class="btn bg-neutral hover:bg-neutral/50 w-full text-xs" onclick="sendAction('moveWindow', {x: parseInt(document.getElementById('moveX').value) || 100, y: parseInt(document.getElementById('moveY').value) || 100})">Move Window</button>
                </div>
                <div class="flex gap-2">
                    <input id="resizeW" type="number" placeholder="Width" class="input input-bordered w-1/2 text-xs" value="800">
                    <input id="resizeH" type="number" placeholder="Height" class="input input-bordered w-1/2 text-xs" value="600">
                </div>
                <div class="tooltip tooltip-top w-full" data-tip="Resizes the window to entered dimensions">
                    <button class="btn bg-neutral hover:bg-neutral/50 w-full text-xs" onclick="sendAction('resizeWindow', {w: parseInt(document.getElementById('resizeW').value) || 800, h: parseInt(document.getElementById('resizeH').value) || 600})">Resize Window</button>
                </div>
            </div>

            <br><hr><br>

            <!-- Window Controls -->
            <h3 class="text-lg font-semibold mb-4">Window Controls</h3>
            <div class="grid grid-cols-3 gap-4">
                <div class="tooltip tooltip-top" data-tip="Maximizes the window">
                    <button class="btn bg-neutral hover:bg-neutral/50 w-full text-xs" onclick="sendAction('maximize')">Maximize</button>
                </div>
                <div class="tooltip tooltip-top" data-tip="Minimizes the window">
                    <button class="btn bg-neutral hover:bg-neutral/50 w-full text-xs" onclick="sendAction('minimize')">Minimize</button>
                </div>
                <div class="tooltip tooltip-top" data-tip="Closes the window">
                    <button class="btn bg-neutral hover:bg-neutral/50 w-full text-xs" onclick="sendAction('close')">Close</button>
                </div>
            </div>

            <br><hr><br>

            <!-- Settings -->
            <h3 class="text-lg font-semibold mb-4">Settings</h3>
            <div class="grid grid-cols-1 gap-4">
                <div class="join w-full text-xs">
                    <button class="btn bg-neutral hover:bg-neutral/50 join-item w-1/3" onclick="window.electronAPI.toggleTheme('dark');"><span class="material-symbols-outlined">moon_stars</span> Dark Mode</button>
                    <button class="btn bg-neutral hover:bg-neutral/50 join-item w-1/3" onclick="window.electronAPI.toggleTheme('light');"><span class="material-symbols-outlined">sunny</span> Light Mode</button>
                    <button class="btn bg-neutral hover:bg-neutral/50 join-item w-1/3" onclick="window.electronAPI.toggleTheme('system');"><span class="material-symbols-outlined">computer</span> System Default</button>
                </div>
            </div>
        </div>

        <script>
            let tabsContainer = document.getElementById("tabs");
            let addTabButton = document.getElementById("addTab");
            let manager = document.getElementById("manager");
            
            let _currentTab = null;
            let _currentIndex = -1;
            let listeners = [];

            let currentTab = {
                get value() {
                    return _currentTab;
                },
                set value(newValue) {
                    _currentTab = newValue;
                    _currentIndex = _currentTab.id.split("-")[1];
                    listeners.forEach((cb) => cb(newValue));
                },
                onChange(callback) {
                    listeners.push(callback);
                }
            };

            function sendAction(action, params) {
                window.electronAPI.sendAction(_currentIndex, action, params);
            }

            function navBack() {
                window.electronAPI.navBack(_currentIndex);
            }

            function navForward() {
                window.electronAPI.navForward(_currentIndex);
            }

            function refreshPage() {
                window.electronAPI.refreshPage(_currentIndex);
            }

            function navigateToUrl() {
                let url = document.getElementById('urlInput').value;
                window.electronAPI.loadURL(_currentIndex, url);
            }

            function handleUrlKeyPress(event) {
                if (event.key === 'Enter') {
                    navigateToUrl();
                }
            }

            function popTab() {
                window.electronAPI.popTab(_currentIndex);
            }

            function addTab() {
                window.electronAPI.addTab();
            }

            electronAPI.toggleManager((visibility) => {
                manager.style.visibility = visibility;
            });

            electronAPI.onTabUpdate((info) => {
                if (info && Object.entries(info).length > 0) {
                    let entries = Object.entries(info);
                    let last = entries.length - 1;
                    let aliveIds = new Set(entries.map(([id]) => `Tab-${id}`));
                    [...tabsContainer.children].forEach(tab => {
                        if (!aliveIds.has(tab.id)) {
                            tab.remove();
                        }
                    });
                    entries.forEach(([id, dict], index) => {
                        let tab = document.getElementById(`Tab-${id}`);
                        if (!tab) {
                            tab = document.createElement("a");
                            tab.role = "tab";
                            tab.id = `Tab-${id}`;
                            tab.className = "tab [--tab-bg:var(--color-base-200)] text-base-content! cursor-default! py-[8px]! px-[12px]! h-[40px]! min-w-[100px]! max-w-[200px]! flex flex-col justify-start gap-[8px]";
                            let title = document.createElement("span");
                            title.innerText = dict["title"];
                            title.className = "text-left truncate h-[20px] min-w-[56px] max-w-[156px]";
                            let close = document.createElement("button");
                            close.innerText = "🞨";
                            close.className = "cursor-pointer h-[20px] w-[12px]";
                            close.addEventListener("click", function() {
                                window.electronAPI.destroyTab(id);
                            });
                            tab.appendChild(title);
                            tab.appendChild(close);
                            tab.setAttribute("data-url", dict["url"]);
                            tabsContainer.appendChild(tab);
                        } else {
                            tab.querySelector("span").innerText = dict["title"];
                            tab.setAttribute("data-url", dict["url"]);
                        }
                        if (index == last) currentTab.value = tab;
                        if (id == _currentIndex) currentTab.value = tab;
                    });
                }
            });

            let slots = [];

            function measure() {
                slots = [...tabsContainer.children].map(element => {
                    let rect = element.getBoundingClientRect();
                    return rect.left + rect.width / 2;
                });
            }

            function closest(value) {
                let closest = Infinity
                let closestIndex = -1

                slots.forEach((center, index) => {
                    if (Math.abs(value - center) < closest) {
                        closest = Math.abs(value - center)
                        closestIndex = index
                    }
                })

                return closestIndex
            }

            function animateSwap(container, dragging) {
                let items = [...container.children].filter(el => el !== dragging);

                let first = new Map();
                items.forEach(el => {
                    first.set(el, el.getBoundingClientRect());
                });

                requestAnimationFrame(() => {
                    items.forEach(el => {
                        let last = el.getBoundingClientRect();
                        let prev = first.get(el);

                        let dx = prev.left - last.left;

                        if (dx) {
                            el.style.transform = `translateX(${dx}px)`;
                            el.getBoundingClientRect();
                            el.style.transform = "";
                        }
                    });
                });
            }

            let dragging = null;
            let startX = 0;
            let dragCenter = 0;

            tabs.addEventListener("pointerdown", event => {
                if (event.target.closest("button")) return;
                let tab = event.target.closest(".tab");
                if (!tab) return;

                currentTab.value = tab;

                measure();

                let placeholder = tab.cloneNode(true);
                placeholder.classList.add("invisible");
                placeholder.classList.add("pointer-events-none");
                placeholder.id = "Tab-X";
                tab.after(placeholder);
                tab._placeholder = placeholder;

                let tabRect = tab.getBoundingClientRect();
                let parentRect = tab.parentElement.getBoundingClientRect();

                tab.style.position = "absolute";
                tab.style.left = (tabRect.left - parentRect.left) + "px";
                tab.style.top  = (tabRect.top  - parentRect.top)  + "px";
                
                dragCenter = tabRect.left + tabRect.width / 2;

                dragging = tab;
                startX = event.clientX;

                tab.setPointerCapture(event.pointerId);
            });

            tabs.addEventListener("pointermove", event => {
                if (!dragging) return;

                let dx = event.clientX - startX;
                dragging.style.left = (dragCenter - dragging.offsetWidth / 2 + dx) + "px";

                let virtualCenter = dragCenter + dx;

                let tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
                let currentIndex = tabs.indexOf(dragging);

                let targetSlot = closest(virtualCenter);
                let destinationIndex = Math.max(0, Math.min(tabs.length, targetSlot));

                if (currentIndex !== destinationIndex) {
                    let placeholder = dragging._placeholder;
                    animateSwap(dragging.parentNode, dragging);

                    if (destinationIndex < currentIndex) {
                        placeholder.parentNode.insertBefore(placeholder, tabs[destinationIndex]);
                    } else {
                        placeholder.parentNode.insertBefore(placeholder, tabs[destinationIndex + 1]);
                    }

                    measure();

                    let rect = dragging.getBoundingClientRect();
                    dragCenter = rect.left + rect.width / 2;
                    startX = event.clientX;
                }
            });

            tabs.addEventListener("pointerup", event => {
                if (!dragging) return;

                let placeholder = dragging._placeholder;
                placeholder.replaceWith(dragging);
                delete dragging._placeholder;

                dragging.style.position = "";
                dragging.style.left = "";
                dragging.style.top = "";
                dragging.releasePointerCapture(event.pointerId);
                dragging = null;
            });

            currentTab.onChange((newTab) => {
                document.querySelectorAll(".tab-active").forEach((tab, index) => {
                    tab.classList.remove('tab-active');
                });
                newTab.classList.add("tab-active");
                document.getElementById('urlInput').value = newTab.getAttribute("data-url");
                window.electronAPI.switchTab(_currentIndex);
            });

            function unique(length) {
                let result           = '';
                let characters       = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
                let charactersLength = characters.length;
                for ( let i = 0; i < length; i++ ) {
                    result += characters.charAt(Math.floor(Math.random() * charactersLength));
                }
                return result;
            }
        </script>
            
        <script type="module">
            var { 
                OverlayScrollbars, 
                ScrollbarsHidingPlugin, 
                SizeObserverPlugin, 
                ClickScrollPlugin  
            } = OverlayScrollbarsGlobal;

            document.querySelectorAll("[data-overlayscrollbars]").forEach((element) => {
                OverlayScrollbars(
                    element,
                    {
                        overflow: {},
                        update: {
                            elementEvents: [['textarea', 'input']],
                            debounce: [0, 0]
                        }
                    }
                );
            });

            document.querySelectorAll("[data-overlayscrollbars-x]").forEach((element) => {
                OverlayScrollbars(
                    element,
                    {
                        overflow: { y: "hidden" },
                        update: {
                            elementEvents: [['textarea', 'input']],
                            debounce: [0, 0]
                        }
                    }
                );
            });

            document.querySelectorAll("[data-overlayscrollbars-y]").forEach((element) => {
                OverlayScrollbars(
                    element,
                    {
                        overflow: { x: "hidden" },
                        update: {
                            elementEvents: [['textarea', 'input']],
                            debounce: [0, 0]
                        }
                    }
                );
            });
        </script>
    </body>
</html>
